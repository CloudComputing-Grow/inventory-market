apiVersion: apps/v1
kind: Deployment
metadata:
  name: grow-inventory-deployment
  labels:
    app: grow-inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grow-inventory
  template:
    metadata:
      labels:
        app: grow-inventory
    spec:
      containers:
      - name: grow-inventory-container
        image: yumyummm/inventory-market:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3004
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        envFrom:
        - configMapRef:
            name: grow-inventory-config
        - secretRef:
            name: grow-inventory-secret
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-market
spec:
  type: ClusterIP
  selector:
    app: grow-inventory
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: grow-inventory-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grow-inventory-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
